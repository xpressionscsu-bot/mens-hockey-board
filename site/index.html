<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Men's Hockey Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: scoreboard-style header, poll list left, wide standings table right; stacks on phones. */
:root {
  --bg: #f2f5f8;
  --surface: #ffffff;
  --fg: #0e1b2b;
  --muted: #5a6b7e;
  --line: #d5dde6;
  --accent: #0b7a75;
  --ice: #1d4f7c;
  --member-tint: #e6eef6;
  --up: #1b7a43;
  --down: #b3261e;
  --warn-bg: #fff3d6;
  --warn-fg: #6b4a00;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b141f; --surface: #111e2d; --fg: #e8eef5; --muted: #93a3b5; --line: #25364a;
    --accent: #4fd1c5; --ice: #7fb3e6; --member-tint: #16293d; --up: #5fd08a; --down: #ff8a80;
    --warn-bg: #3a2e10; --warn-fg: #f2d38a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b141f; --surface: #111e2d; --fg: #e8eef5; --muted: #93a3b5; --line: #25364a;
  --accent: #4fd1c5; --ice: #7fb3e6; --member-tint: #16293d; --up: #5fd08a; --down: #ff8a80;
  --warn-bg: #3a2e10; --warn-fg: #f2d38a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
}
.wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
header { display: flex; flex-direction: column; gap: 6px; border-bottom: 3px solid var(--accent); padding-bottom: 14px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1; letter-spacing: 0.01em; text-transform: uppercase; margin: 0; text-wrap: balance; }
.asof { color: var(--muted); font-size: 0.9rem; margin: 0; }
.grid { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1000px) { .grid { grid-template-columns: 24rem minmax(0, 1fr); } }
section { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.sec-head { padding: 14px 16px 10px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 0.04em; margin: 0; color: var(--ice); }
.sec-head .meta { color: var(--muted); font-size: 0.85rem; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 10px; text-align: right; white-space: nowrap; border-top: 1px solid var(--line); }
th { font-family: var(--font-display); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); border-top: 2px solid var(--fg); background: var(--surface); }
th.l, td.l { text-align: left; }
td.team { font-weight: 600; }
td.rk { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; width: 2.2em; text-align: center; }
tr.member td { background: var(--member-tint); }
.tag { display: inline-block; font-family: var(--font-display); font-weight: 600; font-size: 0.72rem; letter-spacing: 0.08em; padding: 1px 6px; border-radius: 3px; background: var(--ice); color: var(--surface); margin-left: 6px; vertical-align: 2px; }
.mv { font-size: 0.82rem; white-space: nowrap; }
.mv.up { color: var(--up); } .mv.down { color: var(--down); } .mv.flat { color: var(--muted); }
.fp { color: var(--muted); font-size: 0.8rem; margin-left: 4px; }
th.grp { text-align: center; border-top: 0; border-bottom: 1px solid var(--line); padding-block: 6px; color: var(--ice); }
td.pts { font-weight: 700; }
.note { padding: 12px 16px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.85rem; display: flex; flex-direction: column; gap: 6px; }
.note p { margin: 0; }
.stale { background: var(--warn-bg); color: var(--warn-fg); padding: 8px 16px; font-size: 0.85rem; border-top: 1px solid var(--line); }
.empty { padding: 20px 16px; color: var(--muted); }
a { color: var(--ice); text-underline-offset: 2px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.legend { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; background: var(--member-tint); border: 1px solid var(--line); display: inline-block; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Men's Hockey Board</h1>
    <p class="asof" id="asof">Loading the latest poll and standings…</p>
  </header>

  <div class="grid">
    <section aria-labelledby="poll-h">
      <div class="sec-head">
        <h2 id="poll-h">USCHO Poll</h2>
        <span class="meta" id="poll-meta"></span>
      </div>
      <div id="poll-body"></div>
    </section>

    <section aria-labelledby="st-h">
      <div class="sec-head">
        <h2 id="st-h">NCHC Standings</h2>
        <span class="meta" id="st-meta"></span>
      </div>
      <div id="st-body"></div>
    </section>
  </div>

  <p class="asof" id="sources"></p>
</div>

<script>
var NCHC = ["Arizona State", "Colorado College", "Denver", "Miami", "Minnesota Duluth", "North Dakota", "Omaha", "St. Cloud State", "St. Thomas", "Western Michigan"];

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}
function dash(v) { return v == null ? "–" : v; }
function pct(v) {
  if (v == null) return "–";
  var s = v.toFixed(3);
  return v >= 1 ? s : s.replace(/^0/, "");
}
function fmtDate(iso) {
  if (!iso) return "";
  var p = iso.split("-");
  var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
}
function fmtStamp(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}
function staleNote(section) {
  if (!section || section.status === "ok") return "";
  return '<div class="stale">This section could not be refreshed' +
    (section.updated_at ? ". Showing data from " + esc(fmtStamp(section.updated_at)) : "") + ".</div>";
}

function renderPoll(poll) {
  if (!poll || !poll.rows || !poll.rows.length) {
    return '<div class="empty">The poll is not available yet.</div>' + staleNote(poll);
  }
  var rank = {};
  var body = poll.rows.map(function (r) {
    rank[r.team] = r.rank;
    var isMember = NCHC.indexOf(r.team) > -1;
    var mv;
    if (r.last_rank == null) mv = '<span class="mv up">NEW</span>';
    else if (r.last_rank > r.rank) mv = '<span class="mv up">▲ ' + (r.last_rank - r.rank) + "</span>";
    else if (r.last_rank < r.rank) mv = '<span class="mv down">▼ ' + (r.rank - r.last_rank) + "</span>";
    else mv = '<span class="mv flat">–</span>';
    var fp = r.first_place_votes ? '<span class="fp">(' + r.first_place_votes + ")</span>" : "";
    return "<tr" + (isMember ? ' class="member"' : "") + '><td class="rk">' + esc(r.rank) + "</td>" +
      '<td class="l team">' + esc(r.team) + fp + (isMember ? '<span class="tag">NCHC</span>' : "") + "</td>" +
      "<td>" + esc(dash(r.record)) + "</td><td>" + esc(dash(r.points)) + "</td><td>" + mv + "</td></tr>";
  }).join("");
  var html = '<div class="scroll"><table><thead><tr><th>#</th><th class="l">Team</th><th>Rec</th><th>Pts</th><th>Move</th></tr></thead><tbody>' +
    body + '</tbody></table></div>' + staleNote(poll) +
    '<div class="note"><p class="legend"><i></i> NCHC member</p></div>';
  return { html: html, rank: rank };
}

function renderStandings(st, rank) {
  if (!st || !st.rows || !st.rows.length) {
    return '<div class="empty">The standings are not available yet.</div>' + staleNote(st);
  }
  var body = st.rows.map(function (r) {
    var c = r.conference, o = r.overall;
    var nat = rank && rank[r.team] ? "No. " + rank[r.team] : "–";
    return '<tr><td class="rk">' + esc(r.rank) + '</td><td class="l team">' + esc(r.team) + "</td>" +
      "<td>" + nat + "</td>" +
      "<td>" + esc(dash(c.gp)) + '</td><td class="pts">' + esc(dash(c.pts)) + "</td>" +
      "<td>" + esc(c.w + "-" + c.l + "-" + c.t) + "</td><td>" + esc(dash(c.ow)) + "</td><td>" + esc(dash(c.ol)) + "</td><td>" + esc(dash(c.sw)) + "</td><td>" + esc(c.gf + "-" + c.ga) + "</td>" +
      "<td>" + esc(dash(o.gp)) + "</td><td>" + esc(o.w + "-" + o.l + "-" + o.t) + "</td>" +
      "<td>" + pct(o.win_pct) + "</td><td>" + esc(o.gf + "-" + o.ga) + "</td></tr>";
  }).join("");
  return '<div class="scroll"><table><thead>' +
    '<tr><th colspan="3"></th><th class="grp" colspan="7">Conference</th><th class="grp" colspan="4">Overall</th></tr>' +
    '<tr><th>#</th><th class="l">Team</th><th>USCHO</th><th>GP</th><th>Pts</th><th>W-L-T</th><th>OW</th><th>OL</th><th>SW</th><th>GF-GA</th><th>GP</th><th>W-L-T</th><th>Win%</th><th>GF-GA</th></tr>' +
    "</thead><tbody>" + body + "</tbody></table></div>" + staleNote(st) +
    '<div class="note"><p>OW and OL are overtime wins and losses. SW is shootout wins. Teams are listed in the order the NCHC publishes them. Before conference play starts, that order follows overall record.</p></div>';
}

function render(data) {
  var pollOut = renderPoll(data.poll);
  var rank = pollOut && pollOut.rank ? pollOut.rank : {};
  document.getElementById("poll-body").innerHTML = pollOut.html || pollOut;
  document.getElementById("st-body").innerHTML = renderStandings(data.standings, rank);

  var p = data.poll || {}, s = data.standings || {};
  document.getElementById("poll-meta").textContent = p.poll_date ? "Released " + fmtDate(p.poll_date) : "";
  document.getElementById("st-meta").textContent = s.season ? s.season + " season" : "";
  document.getElementById("asof").innerHTML = data.generated_at
    ? "Data last changed " + esc(fmtStamp(data.generated_at)) + '. <a href="data.json">View the JSON</a>.'
    : '<a href="data.json">View the JSON</a>.';
  var src = [];
  if (p.source) src.push('<a href="' + esc(p.source) + '">' + esc(p.name || "USCHO poll") + "</a>");
  if (s.source) src.push('<a href="' + esc(s.source) + '">' + esc(s.name || "NCHC standings") + "</a>");
  document.getElementById("sources").innerHTML = src.length ? "Sources: " + src.join(" and ") + "." : "";
}

if (typeof document !== "undefined" && typeof module === "undefined") {
  fetch("data.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(render)
    .catch(function (err) {
      document.getElementById("asof").textContent =
        "Could not load data.json (" + err.message + "). If you opened this file directly, serve the folder with a local web server instead.";
    });
}
if (typeof module !== "undefined") { module.exports = { renderPoll: renderPoll, renderStandings: renderStandings }; }
</script>
</body>
</html>
